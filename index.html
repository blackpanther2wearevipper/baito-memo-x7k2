<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#3D3DB8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="バイト給料">
<title>バイト給料メモ</title>
<style>
:root{--bg:#F6F7F9;--sf:#fff;--tx:#1B2433;--tx2:#4A5568;--bd:#CBD2DD;--pr:#3D3DB8;--onpr:#fff;--trk:#E3E7EE;
--safe:#0F7A55;--safeb:#E6F6EF;--cau:#8A5A00;--caub:#FFF4D6;--war:#B34700;--warb:#FFE9DA;--dan:#B3261E;--danb:#FDEBEA;--unk:#4A5568;--unkb:#EEF0F4}
@media(prefers-color-scheme:dark){:root{--bg:#0F1622;--sf:#1B2433;--tx:#F2F4F8;--tx2:#B9C1CF;--bd:#4A5568;--pr:#8E8EF0;--onpr:#0F1622;--trk:#333D4F;
--safe:#5FD3A5;--safeb:#1C3437;--cau:#F2C14E;--caub:#333129;--war:#FF9E5E;--warb:#352C2C;--dan:#FF8A80;--danb:#352931;--unk:#B9C1CF;--unkb:#263044}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{padding:16px 16px 4px;max-width:640px;margin:0 auto}h1{font-size:22px;margin:0}h2{font-size:16px;margin:22px 0 6px}
main{padding:0 16px 24px;max-width:640px;margin:0 auto}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:8px 0}
.mut{color:var(--tx2);font-size:14px}.sm{color:var(--tx2);font-size:12px}.err{color:var(--dan);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.amt{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--bd);background:var(--sf);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--pr);border-color:var(--pr);color:var(--onpr)}.btn.dng{color:var(--dan);border-color:var(--dan)}.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
input,select,textarea{width:100%;min-height:48px;padding:0 12px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);font:inherit}
textarea{min-height:96px;padding:8px 12px;font-size:13px;word-break:break-all}
input[type=checkbox]{width:24px;min-height:24px;height:24px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 4px}label.ck{display:flex;gap:8px;align-items:center;font-weight:400;margin:6px 0;min-height:36px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:56px;border:0;background:none;color:var(--tx2);font:inherit;font-size:13px}
nav button.on{color:var(--pr);font-weight:700;box-shadow:inset 0 3px 0 var(--pr)}
.dot{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#1B2433;flex:none}
.pill{display:inline-flex;gap:4px;align-items:center;padding:2px 10px;border-radius:99px;border:1.5px solid var(--c,var(--bd));color:var(--c,var(--tx2));background:var(--sf);font-size:12px;font-weight:600}
.tag{display:inline-block;padding:0 8px;border:1px dashed var(--bd);border-radius:99px;font-size:12px;color:var(--tx2)}
.bar{position:relative;height:10px;background:var(--trk);border-radius:99px;overflow:hidden;margin:8px 0}
.fill{height:100%;background:var(--c)}
.fill.hatch{background:repeating-linear-gradient(45deg,var(--c),var(--c) 4px,rgba(0,0,0,.3) 4px,rgba(0,0,0,.3) 6px)}
.tick{position:absolute;top:0;bottom:0;width:1px;background:var(--bd)}
.s-safe{--c:var(--safe);--b:var(--safeb)}.s-caution{--c:var(--cau);--b:var(--caub)}.s-warning{--c:var(--war);--b:var(--warb)}
.s-danger{--c:var(--dan);--b:var(--danb)}.s-unknown{--c:var(--unk);--b:var(--unkb)}
.wall{border-left:5px solid var(--c)}.wall.t{background:var(--b)}
.line{display:flex;justify-content:space-between;gap:8px;padding:2px 0;font-variant-numeric:tabular-nums}
.shift{cursor:pointer}.canc{text-decoration:line-through;opacity:.6}
hr{border:0;border-top:1px solid var(--bd);margin:10px 0}
summary{min-height:36px;cursor:pointer;padding:6px 0}
ol{padding-left:20px;margin:6px 0}
.seg{display:flex;border:1.5px solid var(--bd);border-radius:12px;overflow:hidden;margin:8px 0}
.seg button{flex:1;min-height:44px;border:0;background:var(--sf);color:var(--tx2);font:inherit;font-weight:600}
.seg button[aria-pressed=true]{background:var(--pr);color:var(--onpr)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:8px 0}
.cal .wh{text-align:center;font-size:12px;color:var(--tx2);padding:4px 0}
.cell{min-height:68px;padding:3px 2px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);font:inherit;display:flex;flex-direction:column;align-items:stretch;gap:2px;cursor:pointer;text-align:left;overflow:hidden;min-width:0}
.cell.out{opacity:.45}.cell.sel{outline:3px solid var(--pr);outline-offset:-1px}
.cell .dn{font-size:12px;font-weight:600;padding-left:2px}.cell.td .dn{font-weight:800;text-decoration:underline}
.chip{display:block;height:15px;line-height:11px;font-size:10px;font-style:normal;border:2px solid var(--k);border-radius:4px;padding:0 2px;white-space:nowrap;overflow:hidden;color:var(--tx)}
.chip.w{background:var(--k);color:#1B2433}
.more{font-size:10px;color:var(--tx2);padding-left:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ================= 基本ユーティリティ ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const WD='日月火水木金土';
const dayOfDate=s=>{const a=s.split('-').map(Number);return Date.UTC(a[0],a[1]-1,a[2])/86400000};
const dateOfDay=n=>new Date(n*86400000).toISOString().slice(0,10);
const addDays=(s,n)=>dateOfDay(dayOfDate(s)+n);
const dayOf=m=>Math.floor(m/1440), todOf=m=>m-dayOf(m)*1440, dowOf=d=>((d+4)%7+7)%7;
const toMin=(date,t)=>{const a=t.split(':').map(Number);return dayOfDate(date)*1440+a[0]*60+a[1]};
const fmtD=d=>{const a=d.split('-').map(Number);return a[1]+'/'+a[2]+'('+WD[dowOf(dayOfDate(d))]+')'};
const dur=m=>Math.floor(m/60)+'h'+pad(m%60)+'m';
const divRound=(n,d)=>Math.floor((2*n+d)/(2*d));
const addMonth=(m,d)=>{let y=+m.slice(0,4),k=+m.slice(5,7)-1+d;y+=Math.floor(k/12);k=((k%12)+12)%12;return y+'-'+pad(k+1)};
const opt=(v,l,cur)=>'<option value="'+esc(v)+'"'+(String(v)===String(cur)?' selected':'')+'>'+l+'</option>';
const COLORS=['#4F8EF7','#34C38F','#F5A623','#A98AFF','#F05D5E','#8A94A6'],CNAMES=['青','緑','橙','紫','赤','灰'];

/* ================= 壁の初期値(すべて未確認) ================= */
const CATS=['住民税','所得税','社会保険','配偶者','扶養','その他'];
const DEFAULT_WALLS=()=>[
 {id:'res110',cat:'住民税',name:'110万円(住民税がかかり始める目安)',amount:1100000,basis:'cal',commute:false,incl:false,on:true,scope:'',noPrem:false,ver:'',
  note:'給与収入が約110万円を超えると住民税(均等割・所得割)がかかり始める目安です。自治体の区分や扶養の有無で変わります。給与所得控除の最低額が65万円に上がったため、従来の100万円から110万円になったと私は理解しています(要確認)。'},
 {id:'tax160',cat:'所得税',name:'160万円(所得税がかかり始める)',amount:1600000,basis:'cal',commute:false,incl:false,on:true,scope:'',noPrem:false,ver:'',
  note:'給与収入が160万円を超えると所得税がかかり始める目安です。基礎控除の特例(95万円)を前提にしており、この特例は2025・2026年分の措置と私は理解しています。従来は103万円でした(要確認)。非課税の通勤手当は含めません。'},
 {id:'si106',cat:'社会保険',name:'106万円(勤務先の社会保険に加入する目安)',amount:1056000,basis:'n12',commute:false,incl:true,on:true,scope:'wp',noPrem:true,ver:'',
  note:'実際の要件は、月額賃金8.8万円以上(残業代・通勤手当などは除く)、週20時間以上、従業員51人超の勤務先(段階的に拡大予定)、2か月超の雇用見込み、学生でないこと、の全部です。賃金要件は撤廃される予定ですが、時期は要確認です。ここでは「月8.8万円×12」を勤務先ごとに見る簡易目安だけを出します。'},
 {id:'sp123',cat:'配偶者',name:'123万円(配偶者控除の対象から外れる)',amount:1230000,basis:'cal',commute:false,incl:false,on:true,scope:'',noPrem:false,ver:'',
  note:'配偶者の収入が123万円を超えると、納税者本人の「配偶者控除」の対象から外れ、「配偶者特別控除」(160万円までは満額38万円)に切り替わります。そのため世帯の手取りはほぼ変わらないと私は理解しています(要確認)。納税者本人の所得にも条件があります。'},
 {id:'sp160',cat:'配偶者',name:'160万円(配偶者特別控除が満額でなくなる)',amount:1600000,basis:'cal',commute:false,incl:false,on:true,scope:'',noPrem:false,ver:'',
  note:'配偶者の収入が160万円を超えると、配偶者特別控除が満額(38万円)から段階的に減ります(要確認)。'},
 {id:'sp201',cat:'配偶者',name:'201.6万円(配偶者特別控除がなくなる)',amount:2016000,basis:'cal',commute:false,incl:true,on:true,scope:'',noPrem:false,ver:'',
  note:'配偶者の収入が約201.6万円以上になると、配偶者特別控除がゼロになる目安です(納税者本人の所得が一定以下の場合。要確認)。'},
 {id:'si130',cat:'扶養',name:'130万円(健康保険・年金の扶養から外れる)',amount:1300000,basis:'n12',commute:true,incl:true,on:true,scope:'',noPrem:false,ver:'',
  note:'今後1年間の見込み収入(交通費・残業代を含む)が130万円以上になると、健康保険・年金の扶養(被扶養者・第3号被保険者)から外れる目安です。60歳以上や障害のある方は180万円です。一時的な収入増は事業主の証明で扱いが変わる場合があります。加入先の健保組合で必ず確認してください。'},
 {id:'fam',cat:'扶養',name:'勤務先の配偶者手当の基準(自分で設定)',amount:1030000,basis:'cal',commute:false,incl:false,on:false,scope:'',noPrem:false,ver:'',
  note:'配偶者手当(家族手当)の支給条件は会社ごとに違います。就業規則で確認して金額を設定し、「表示する」をオンにしてください。'}];
const OLD_WALL_IDS=['w110','w130','w150','w160'];

/* ================= データ保存・検査 ================= */
const KEY='baito-memo-v1';
let S=load();
let PERSIST=null;
function migrateWalls(ws,ver){
 ws=Array.isArray(ws)?ws.filter(w=>w&&typeof w.id==='string'):[];
 const clean=w=>({id:w.id,name:String(w.name||'壁').slice(0,60),amount:(+w.amount>0?Math.round(+w.amount):1000000),basis:w.basis==='n12'?'n12':'cal',
  commute:!!w.commute,incl:!!w.incl,on:w.on!==false,cat:w.cat||'その他',note:String(w.note||'').slice(0,600),scope:w.scope==='wp'?'wp':'',noPrem:!!w.noPrem,ver:String(w.ver||'')});
 if(ver>=2)return ws.map(clean);
 return DEFAULT_WALLS().concat(ws.filter(w=>!OLD_WALL_IDS.includes(w.id)).map(clean));
}
function sanitize(j){
 const num=(x,f)=>(x===''||x==null||!Number.isFinite(+x))?f:+x;
 const D=/^\d{4}-\d\d-\d\d$/,T=/^\d\d:\d\d(:\d\d)?$/;
 const dayN=(v,f)=>+v===99?99:Math.min(28,Math.max(1,Math.round(num(v,f))));
 const wps=(Array.isArray(j.wps)?j.wps:[]).filter(w=>w&&typeof w.id==='string').map(w=>({
  id:w.id,name:String(w.name||'').slice(0,60),color:COLORS[w.color]?+w.color:0,
  wages:(Array.isArray(w.wages)?w.wages:[]).filter(x=>x&&D.test(x.from)&&num(x.yen,0)>0).map(x=>({from:x.from,yen:Math.round(+x.yen)})),
  nightPct:Math.min(100,Math.max(0,Math.round(num(w.nightPct,25)))),otPct:Math.min(100,Math.max(0,Math.round(num(w.otPct,25)))),holPct:Math.min(100,Math.max(0,Math.round(num(w.holPct,35)))),
  holDow:(w.holDow===''||w.holDow==null)?'':Math.min(6,Math.max(0,Math.round(num(w.holDow,0)))),
  commute:Math.max(0,Math.round(num(w.commute,0))),closing:dayN(w.closing,99),payDay:dayN(w.payDay,25),offset:Math.min(2,Math.max(0,Math.round(num(w.offset,1))))}));
 const ids=new Set(wps.map(w=>w.id));
 const shifts=(Array.isArray(j.shifts)?j.shifts:[]).filter(s=>s&&typeof s.id==='string'&&ids.has(s.wpId)&&D.test(s.date)&&T.test(s.start)&&T.test(s.end)).map(s=>({
  id:s.id,wpId:s.wpId,date:s.date,start:s.start.slice(0,5),end:s.end.slice(0,5),
  status:['planned','worked','cancelled'].includes(s.status)?s.status:'planned',
  breakMode:['auto','none','manual'].includes(s.breakMode)?s.breakMode:'auto',breakMin:Math.max(0,Math.round(num(s.breakMin,0))),
  aStart:T.test(s.aStart||'')?s.aStart.slice(0,5):'',aEnd:T.test(s.aEnd||'')?s.aEnd.slice(0,5):''}));
 return{v:1,wps:wps,shifts:shifts,walls:migrateWalls(j.walls,j.wallsVer),wallsVer:2,
  last:ids.has(j.last)?j.last:'',lastBackup:D.test(j.lastBackup||'')?j.lastBackup:'',chg:Math.max(0,Math.round(num(j.chg,0))),hideIos:!!j.hideIos};
}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.v===1)return sanitize(j)}catch(e){}return sanitize({v:1})}
function save(skip){if(!skip)S.chg=(S.chg||0)+1;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('保存できませんでした(プライベートブラウズや容量不足の可能性)')}}
const wpOf=id=>S.wps.find(w=>w.id===id);
const newWp=()=>({id:uid(),name:'',color:0,wages:[{from:'2000-01-01',yen:''}],nightPct:25,otPct:25,holPct:35,holDow:'',commute:0,closing:99,payDay:25,offset:1});

/* ================= 給与計算 ================= */
const WEEK0=0;
function payDateFor(date,closing,payDay,offset){
 const a=date.split('-').map(Number),y=a[0],m=a[1],d=a[2];
 const dim=(yy,mm)=>new Date(Date.UTC(yy,mm,0)).getUTCDate();
 const cl=Math.min(closing===99?31:closing,dim(y,m));
 let mm=m+(d<=cl?0:1)+offset,yy=y;
 yy+=Math.floor((mm-1)/12);mm=((mm-1)%12+12)%12+1;
 const pd=Math.min(payDay===99?31:payDay,dim(yy,mm));
 const r=yy+'-'+pad(mm)+'-'+pad(pd);
 return r<date?date:r;
}
function wageAt(wp,date){let b=null;for(const w of wp.wages)if(w.from<=date&&(!b||w.from>b.from))b=w;return b?b.yen:null}
function times(s){
 const useA=s.status==='worked'&&s.aStart&&s.aEnd;
 const st=toMin(s.date,useA?s.aStart:s.start);let en=toMin(s.date,useA?s.aEnd:s.end);
 if(en<=st)en+=1440;return{st:st,en:en};
}
function calcWp(wp,list){
 const out={},dayC=new Map(),weekC=new Map(),paid=new Set();
 const rows=list.filter(s=>s.status!=='cancelled').map(s=>({s:s,...times(s)})).sort((a,b)=>a.st-b.st||a.en-b.en);
 const isHol=d=>wp.holDow!==''&&wp.holDow!=null&&dowOf(d)===+wp.holDow;
 for(const row of rows){
  const s=row.s,st=row.st,en=row.en,span=en-st;
  const br=s.breakMode==='manual'?Math.min(Math.max(0,Math.round(+s.breakMin||0)),span-1):s.breakMode==='none'?0:(span>480?60:span>360?45:0);
  const bs=st+Math.floor((span-br)/2);
  const segs=br>0?[[st,bs],[bs+br,en]]:[[st,en]];
  const wd=dayOf(st),wk=wd-((dowOf(wd)+7-WEEK0)%7);
  let dc=dayC.get(wd)||0,wc=weekC.get(wk)||0;
  const r={st:st,en:en,span:span,br:br,work:0,ot:0,night:0,nightOt:0,hol:0,wage:wageAt(wp,s.date),commute:0,gross:null};
  for(const sg of segs)for(let m=sg[0];m<sg[1];m++){
   r.work++;
   const t=todOf(m),night=t>=1320||t<300;
   if(night)r.night++;
   if(isHol(dayOf(m))){r.hol++;continue}
   const ot=dc>=480||wc>=2400;dc++;
   if(ot){r.ot++;if(night)r.nightOt++}else wc++;
  }
  dayC.set(wd,dc);weekC.set(wk,wc);
  const w=r.wage;
  if(w!=null){
   if(wp.commute>0&&!paid.has(wd)&&r.work>0){r.commute=wp.commute;paid.add(wd)}
   r.base=divRound(w*r.work,60);r.nPay=divRound(w*wp.nightPct*r.night,6000);
   r.oPay=divRound(w*wp.otPct*r.ot,6000);r.hPay=divRound(w*wp.holPct*r.hol,6000);
   r.gross=r.base+r.nPay+r.oPay+r.hPay+r.commute;
  }
  out[s.id]=r;
 }
 return out;
}
function calcAll(shifts){const R={};for(const wp of S.wps)Object.assign(R,calcWp(wp,shifts.filter(s=>s.wpId===wp.id)));return R}

/* ================= 壁の判定 ================= */
const ST={safe:['余裕あり','✔'],caution:['注意','ⓘ'],warning:['警戒','▲'],danger:['超過','■'],unknown:['情報不足','?']};
const RANK={danger:4,warning:3,caution:2,safe:1,unknown:0};
function wallStatus(v,t,incl){
 if(v==null||!(t>0))return'unknown';v=Math.max(0,v);
 if(incl?v>=t:v>t)return'danger';
 if(v*10>=t*9)return'warning';if(v*10>=t*8)return'caution';return'safe';
}
const wallPercent=(v,t)=>Math.floor(Math.max(0,v)*100/t);
const pctLabel=p=>p>=200?'200%以上':p+'%';
function wallValue(w,R,shifts,today,wpId){
 const y=today.slice(0,4),it=[];
 for(const s of shifts){
  if(wpId&&s.wpId!==wpId)continue;
  const r=R[s.id];if(!r||r.gross==null||s.status==='cancelled')continue;
  const wp=wpOf(s.wpId);if(!wp)continue;
  it.push({d:s.date,pay:payDateFor(s.date,wp.closing,wp.payDay,wp.offset),amt:w.noPrem?r.base:r.gross-(w.commute?0:r.commute)});
 }
 if(w.basis==='cal'){
  let v=0,paid=0;
  for(const i of it)if(i.pay.slice(0,4)===y){v+=i.amt;if(i.pay<=today)paid+=i.amt}
  return{v:v,paid:paid,sched:v-paid};
 }
 const end=addDays(today,365),back=addDays(today,-90);let reg=0,past=0;
 for(const i of it){if(i.d>=today&&i.d<end)reg+=i.amt;else if(i.d>=back&&i.d<today)past+=i.amt}
 const pace=past/90*365;
 return{v:Math.max(reg,pace),reg:reg,pace:pace};
}
function wallList(R,shifts,today){
 const out=[];
 for(const w of S.walls){
  if(w.on===false)continue;
  const targets=w.scope==='wp'?S.wps:[null];
  for(const p of targets){
   const x=wallValue(w,R,shifts,today,p&&p.id);
   if(p&&x.v===0)continue;
   out.push({w:w,wp:p,key:w.id+(p?':'+p.id:''),...x,status:wallStatus(x.v,w.amount,w.incl)});
  }
 }
 return out.sort((a,b)=>RANK[b.status]-RANK[a.status]||b.v/b.w.amount-a.v/a.w.amount);
}
function avgWage(R,shifts){
 let g=0,m=0;for(const s of shifts){const r=R[s.id];if(r&&r.gross!=null&&s.status!=='cancelled'){g+=r.gross-r.commute;m+=r.work}}

/* ================= カレンダー・Googleカレンダー ================= */
function monthGrid(m){
 const d0=dayOfDate(m+'-01'),lead=dowOf(d0);
 const dim=new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7),0)).getUTCDate();
 const total=Math.ceil((lead+dim)/7)*7,cells=[];
 for(let i=0;i<total;i++)cells.push(dateOfDay(d0-lead+i));
 return cells;
}
const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
const icsStamp=m=>new Date((m-540)*60000).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
function icsFold(line){
 const enc=new TextEncoder();let out='',cur='',n=0;
 for(const ch of line){const b=enc.encode(ch).length;if(n+b>72){out+=cur+'\r\n ';cur='';n=0}cur+=ch;n+=b}
 return out+cur;
}
function buildIcs(list,R,withAmt,wpFn){
 const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//baito-memo//JA','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:バイト'];
 for(const s of list){
  const wp=wpFn(s.wpId);if(!wp)continue;
  const t=times(s),r=R[s.id],parts=[];
  if(r){parts.push('実働 '+dur(r.work));if(withAmt&&r.gross!=null)parts.push((s.status==='worked'?'':'見込 ')+yen(r.gross))}
  parts.push('バイト給料メモより');
  L.push('BEGIN:VEVENT','UID:'+s.id+'@baito-memo','DTSTAMP:'+now,'DTSTART:'+icsStamp(t.st),'DTEND:'+icsStamp(t.en),
   'SUMMARY:'+icsEsc(wp.name+(s.status==='worked'?'(実績)':'')),'DESCRIPTION:'+icsEsc(parts.join(' / ')),'END:VEVENT');
 }
 L.push('END:VCALENDAR');
 return L.map(icsFold).join('\r\n')+'\r\n';
}
function gcalUrl(s){
 const wp=wpOf(s.wpId),t=times(s);
 return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(wp.name)+'&dates='+icsStamp(t.st)+'/'+icsStamp(t.en)+'&details='+encodeURIComponent('バイト給料メモより');
}
function download(blob,name){
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportIcs(){
 const r=$('#icsRange'),a=$('#icsAmt'),future=!r||r.value==='future',today=todayStr();
 const list=S.shifts.filter(s=>s.status!=='cancelled'&&wpOf(s.wpId)&&(!future||s.date>=today)).sort(byStart);
 if(!list.length){alert('書き出すシフトがありません');return}
 download(new Blob([buildIcs(list,calcAll(S.shifts),!!(a&&a.checked),wpOf)],{type:'text/calendar;charset=utf-8'}),'baito-shifts-'+todayStr()+'.ics');
}

/* ================= バックアップ ================= */
function backupObj(){return Object.assign({},S,{app:'baito-memo',exportedAt:new Date().toISOString()})}
function markBackup(){S.lastBackup=todayStr();S.chg=0;save(true)}
function exportData(){
 download(new Blob([JSON.stringify(backupObj(),null,1)],{type:'application/json'}),'baito-backup-'+todayStr()+'.json');
 markBackup();
}
async function shareBackup(){
 const txt=JSON.stringify(backupObj(),null,1),name='baito-backup-'+todayStr()+'.json';
 for(const type of['application/json','text/plain']){
  const file=new File([txt],name,{type:type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
   try{await navigator.share({files:[file],title:'バイト給料メモ バックアップ'});markBackup();render();return}
   catch(e){if(e&&e.name==='AbortError')return}
  }
 }
 exportData();render();
}
function backupInfo(){
 if(!S.wps.length&&!S.shifts.length)return null;
 if(!S.lastBackup)return'まだ一度もバックアップしていません';
 const days=dayOfDate(todayStr())-dayOfDate(S.lastBackup);
 if(days>=14)return'最後のバックアップから'+days+'日たっています';
 if((S.chg||0)>=30)return'前回のバックアップから変更が'+S.chg+'回あります';
 return null;
}
function isIosBrowser(){
 return/iPhone|iPad|iPod/.test(navigator.userAgent)&&!(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches));
}
function toB64(bytes){let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s)}
function fromB64(t){const s=atob(t),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
async function pipeBytes(bytes,stream){
 const res=new Response(new Blob([bytes]).stream().pipeThrough(stream));
 return new Uint8Array(await res.arrayBuffer());
}
async function encodeBackup(obj){
 const raw=new TextEncoder().encode(JSON.stringify(obj));
 if(typeof CompressionStream==='function'){try{return'BAITO1:'+toB64(await pipeBytes(raw,new CompressionStream('gzip')))}catch(e){}}
 return'BAITO0:'+toB64(raw);
}
async function decodeBackup(text){
 const t=String(text).replace(/\s+/g,''),i=t.indexOf(':'),tag=t.slice(0,i);
 if(tag!=='BAITO0'&&tag!=='BAITO1')throw new Error('形式');
 let bytes=fromB64(t.slice(i+1));
 if(tag==='BAITO1')bytes=await pipeBytes(bytes,new DecompressionStream('gzip'));
 return JSON.parse(new TextDecoder().decode(bytes));
}
function applyImport(raw){
 let j;
 try{if(!raw||raw.v!==1||!Array.isArray(raw.wps)||!Array.isArray(raw.shifts))throw 0;j=sanitize(raw)}
 catch(e){alert('バックアップの形式が違います');return false}
 const msg='今のデータ(勤務先'+S.wps.length+'・シフト'+S.shifts.length+'件)を、次の内容で置き換えます。\n\n勤務先'+j.wps.length+'・シフト'+j.shifts.length+'件'+
  (raw.exportedAt?'\n書き出し日: '+String(raw.exportedAt).slice(0,10):'')+'\n\nよろしいですか?(直前の状態は設定の「元に戻す」で復元できます)';
 if(!confirm(msg))return false;
 try{localStorage.setItem(KEY+'-prev',JSON.stringify(S))}catch(e){}
 S=j;UI.form=null;UI.wpForm=null;UI.code='';markBackup();render();return true;
}
function importFile(file){
 if(!file)return;const fr=new FileReader();
 fr.onload=()=>{let j;try{j=JSON.parse(fr.result)}catch(e){alert('読み込めないファイルです');return}if(applyImport(j))alert('読み込みました')};
 fr.readAsText(file);
}
async function restoreCode(){
 const el=$('#codeIn'),t=el?el.value.trim():'';
 if(!t){alert('コードを貼り付けてください');return}
 let j;try{j=await decodeBackup(t)}catch(e){alert('コードを読み取れませんでした。最後までコピーできているか確認してください');return}
 if(applyImport(j))alert('読み込みました');
}
function copyCode(){
 const done=()=>alert('コピーしました。LINEのKeepメモなどに貼り付けて、新しい端末に送ってください');
 const manual=()=>{const el=$('#codeOut');if(el){el.focus();el.select();try{if(document.execCommand('copy')){done();return}}catch(e){}}alert('コピーできませんでした。枠の中を長押しして「すべて選択」→「コピー」をしてください')};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(UI.code).then(done,manual);else manual();
}

function payGroups(R){
 const m=new Map();
 for(const s of S.shifts){
  const r=R[s.id];if(s.status==='cancelled'||!r||r.gross==null)continue;
  const wp=wpOf(s.wpId);if(!wp)continue;
  const p=payDateFor(s.date,wp.closing,wp.payDay,wp.offset);
  let g=m.get(p);if(!g){g={pay:p,gross:0,commute:0,all:true,by:new Map(),from:s.date,to:s.date};m.set(p,g)}
  g.gross+=r.gross;g.commute+=r.commute;if(s.status!=='worked')g.all=false;
  g.by.set(wp.id,(g.by.get(wp.id)||0)+r.gross);
  if(s.date<g.from)g.from=s.date;if(s.date>g.to)g.to=s.date;
 }
 return[...m.values()].sort((a,b)=>a.pay<b.pay?-1:1);
}

function monthSum(m,R){

  if(s.date.slice(0,7)!==m||s.status==='cancelled')continue;
  const r=R[s.id];if(!r||r.gross==null)continue;
  if(s.status==='worked')act+=r.gross;else pl+=r.gross;cm+=r.commute;
 }
 return{act:act,pl:pl,cm:cm};
}

/* ================= シフトの入力 ================= */
function recentTimes(id){
 const seen=[];
 for(const s of S.shifts.filter(s=>s.wpId===id).sort((a,b)=>a.date<b.date?1:-1)){const k=s.start+'|'+s.end;if(!seen.includes(k))seen.push(k);if(seen.length>=4)break}
 return seen.map(k=>k.split('|'));
}
const norm=f=>({id:f.id,wpId:f.wpId,date:f.date,start:f.start,end:f.end,status:f.status,breakMode:f.breakMode,
 breakMin:f.breakMode==='manual'?Math.round(+f.breakMin||0):0,aStart:f.status==='worked'?(f.aStart||''):'',aEnd:f.status==='worked'?(f.aEnd||''):''});
function formError(f){
 if(!f.wpId)return'勤務先を選んでください';
 if(!f.date)return'日付を入力してください';
 if(!f.start||!f.end)return'開始と終了の時刻を入力してください';
 if(f.start===f.end)return'開始と終了が同じ時刻です';
 if(f.status==='worked'&&((f.aStart&&!f.aEnd)||(!f.aStart&&f.aEnd)))return'実績は開始と終了の両方を入力してください';
 if(f.status==='worked'&&f.aStart&&f.aStart===f.aEnd)return'実績の開始と終了が同じ時刻です';
 const sh=norm(f),t=times(sh);
 if(f.breakMode==='manual'&&sh.breakMin>=t.en-t.st)return'休憩が勤務時間以上です';
 return'';
}
function estHtml(){
 const f=UI.form,err=formError(f);if(err)return'<p class="err">⚠ '+err+'</p>';
 const sh=norm(f);if(sh.status==='cancelled')return'<p class="mut">取消のシフトは集計に含まれません</p>';
 const wp=wpOf(sh.wpId);
 const nextShifts=S.shifts.filter(s=>s.id!==sh.id).concat([sh]);
 const r=calcWp(wp,nextShifts.filter(s=>s.wpId===wp.id))[sh.id];
 if(r.gross==null)return'<p class="mut">この日付に有効な時給がありません。勤務先の設定で時給を確認してください。</p>';
 const L=(a,b)=>'<div class="line"><span>'+a+'</span><span>'+b+'</span></div>';
 let h=L('実働(休憩'+r.br+'分を除く)',dur(r.work))+L('基本',yen(r.base))+
  (r.night?L('深夜割増('+dur(r.night)+')',yen(r.nPay)):'')+(r.ot?L('残業割増('+dur(r.ot)+')',yen(r.oPay)):'')+
  (r.hol?L('休日割増('+dur(r.hol)+')',yen(r.hPay)):'')+(r.commute?L('交通費',yen(r.commute)):'')+
  '<hr><div class="line"><b>合計</b><span class="amt">'+yen(r.gross)+'</span></div>';
 const today=todayStr(),R1=calcAll(S.shifts),R2=calcAll(nextShifts);
 const b=wallList(R1,S.shifts,today),a=wallList(R2,nextShifts,today);
 if(a.length){
  const ch=a.filter(x=>{const y0=b.find(z=>z.key===x.key);return!y0||Math.round(y0.v)!==Math.round(x.v)});
  h+='<hr><b>壁への影響</b>';
  if(!ch.length)h+='<div class="sm" style="margin-top:6px">どの壁の金額も変わりません</div>';
  for(const x of ch){
   const y0=b.find(z=>z.key===x.key);
   h+='<div class="sm" style="margin-top:6px">'+esc(x.w.name)+(x.wp?'('+esc(x.wp.name)+')':'')+'<br>'+yen(y0?y0.v:0)+' → <b>'+yen(x.v)+'</b>('+pctLabel(wallPercent(x.v,x.w.amount))+' '+ST[x.status][1]+ST[x.status][0]+')</div>';
  }
  const pay=payDateFor(sh.date,wp.closing,wp.payDay,wp.offset);
  if(pay.slice(0,4)!==today.slice(0,4))h+='<div class="sm" style="margin-top:6px">※ このシフトの支払日は '+fmtD(pay)+'('+pay.slice(0,4)+'年)。暦年の壁には今年分として入りません。</div>';
 }
 return h;
}

function saveWp(){
 readWp();const f=UI.wpForm,num=(v,d)=>{const n=Number(v);return Number.isFinite(n)&&v!==''?n:d};
 const wages=f.wages.map(w=>({from:w.from,yen:Math.round(num(w.yen,0))})).filter(w=>w.from&&w.yen>0);
 if(!f.name.trim()){alert('勤務先名を入力してください');return}
 if(!wages.length){alert('時給を入力してください');return}
 const pc=v=>Math.min(100,Math.max(0,Math.round(num(v,0))));
 const wp={id:f.id,name:f.name.trim().slice(0,60),color:+f.color,wages:wages,nightPct:pc(f.nightPct),otPct:pc(f.otPct),holPct:pc(f.holPct),
  holDow:f.holDow===''?'':+f.holDow,commute:Math.max(0,Math.round(num(f.commute,0))),closing:+f.closing,payDay:+f.payDay,offset:+f.offset};
 const i=S.wps.findIndex(x=>x.id===wp.id);if(i>=0)S.wps[i]=wp;else S.wps.push(wp);
 save();UI.wpForm=null;render();
}

/* ================= 自己テスト ================= */
function runTests(){
 const res=[],ps=[];
 const T=(n,f)=>{try{const x=f();res.push({n:n,ok:x===true,d:String(x)})}catch(e){res.push({n:n,ok:false,d:String(e)})}};
 const TA=(n,f)=>{ps.push(f().then(x=>res.push({n:n,ok:x===true,d:String(x)}),e=>res.push({n:n,ok:false,d:String(e)})))};
 const eq=(a,b)=>a===b||'期待 '+b+' / 実際 '+a;
 const all=(...xs)=>{for(const x of xs)if(x!==true)return x;return true};
 const mk=o=>({...newWp(),wages:[{from:'2000-01-01',yen:1200}],...o});
 const sh=(d,s,e,o)=>({id:uid(),wpId:'t',date:d,start:s,end:e,status:'planned',breakMode:'auto',...o});
 const one=(wp,s)=>calcWp(wp,[s])[s.id];
 T('夕方17:00–22:30・交通費400 = 7,150円',()=>{const r=one(mk({commute:400}),sh('2025-12-05','17:00','22:30'));return all(eq(r.gross,7150),eq(r.night,30),eq(r.work,330))});
 T('日またぎ22:00→7:00・自動休憩 = 11,400円',()=>{const r=one(mk(),sh('2025-12-05','22:00','07:00'));return all(eq(r.gross,11400),eq(r.work,480),eq(r.night,360))});
 T('1日8時間超の残業(9:00–19:00) = 11,100円',()=>{const r=one(mk(),sh('2025-12-05','09:00','19:00'));return all(eq(r.gross,11100),eq(r.ot,60))});
 T('深夜と残業の重なり(14:00→24:00) = 11,700円',()=>{const r=one(mk(),sh('2025-12-05','14:00','00:00'));return all(eq(r.gross,11700),eq(r.night,120),eq(r.nightOt,60))});
 T('法定休日(日曜10:00–15:00) = 8,100円',()=>{const r=one(mk({holDow:0}),sh('2025-12-07','10:00','15:00'));return all(eq(r.gross,8100),eq(r.hol,300))});
 T('土曜→日曜(休日)へまたぐ = 9,240円',()=>{const r=one(mk({holDow:0}),sh('2025-12-06','20:00','02:00'));return all(eq(r.gross,9240),eq(r.hol,120),eq(r.night,240))});
 T('法定休日なしなら日曜も通常 = 6,000円',()=>eq(one(mk(),sh('2025-12-07','10:00','15:00')).gross,6000));
 T('週40時間超(月〜金9–18、土9–13) = 54,000円',()=>{
  const list=[1,2,3,4,5].map(d=>sh('2025-12-0'+d,'09:00','18:00')).concat(sh('2025-12-06','09:00','13:00'));
  const o=calcWp(mk(),list);return eq(list.reduce((a,s)=>a+o[s.id].gross,0),54000)});
 T('同じ日の2件目は日の累計を引き継ぐ・交通費は1日1回',()=>{
  const a=sh('2025-12-01','09:00','14:00'),b=sh('2025-12-01','17:00','21:00');const o=calcWp(mk({commute:400}),[a,b]);
  return all(eq(o[b.id].ot,60),eq(o[a.id].commute+o[b.id].commute,400))});
 T('時給の履歴(12/2から1,100円)',()=>{
  const wp=mk({wages:[{from:'2000-01-01',yen:1000},{from:'2025-12-02',yen:1100}]});
  return all(eq(one(wp,sh('2025-12-01','17:00','20:00')).gross,3000),eq(one(wp,sh('2025-12-02','17:00','20:00')).gross,3300))});
 T('実績の時刻が予定より優先される',()=>{const r=one(mk(),sh('2025-12-05','17:00','22:00',{status:'worked',aStart:'17:00',aEnd:'21:00'}));return eq(r.work,240)});
 T('取消は計算に含まれない',()=>eq(Object.keys(calcWp(mk(),[sh('2025-12-05','17:00','22:00',{status:'cancelled'})])).length,0));
 T('時給が未設定なら金額は null',()=>eq(one(mk({wages:[{from:'2030-01-01',yen:1000}]}),sh('2025-12-05','17:00','22:00')).gross,null));
 T('支払日: 末日締め・翌月25日',()=>eq(payDateFor('2025-12-05',99,25,1),'2026-01-25'));
 T('支払日: 15日締め・翌月25日(12/20)',()=>eq(payDateFor('2025-12-20',15,25,1),'2026-02-25'));
 T('支払日: 月末への丸め',()=>eq(payDateFor('2026-02-10',99,31,0),'2026-02-28'));
 T('支払日: 当月払い',()=>eq(payDateFor('2025-12-10',15,25,0),'2025-12-25'));
 T('壁の状態の境界',()=>all(eq(wallStatus(799,1000,true),'safe'),eq(wallStatus(800,1000,true),'caution'),eq(wallStatus(900,1000,true),'warning'),
  eq(wallStatus(999,1000,true),'warning'),eq(wallStatus(1000,1000,true),'danger'),eq(wallStatus(1000,1000,false),'warning'),eq(wallStatus(1001,1000,false),'danger'),eq(wallStatus(null,1000,true),'unknown')));
 T('表示%は切り捨て(99.9% → 99%)',()=>eq(wallPercent(1298700,1300000),99));
 T('壁: 123万円ちょうどは超過でない・130万円ちょうどは超過',()=>all(
  eq(wallStatus(1230000,1230000,false),'warning'),eq(wallStatus(1230001,1230000,false),'danger'),
  eq(wallStatus(1299999,1300000,true),'warning'),eq(wallStatus(1300000,1300000,true),'danger')));
 T('壁の初期値は8件・すべて未確認',()=>{const d=DEFAULT_WALLS();return all(eq(d.length,8),eq(d.every(w=>w.ver===''),true))});
 T('壁の移行: 旧初期値は置き換わり、独自の壁は残る',()=>{
  const r=migrateWalls([{id:'w130',name:'a',amount:1},{id:'my',name:'独自',amount:5}],undefined);
  return all(eq(r.some(w=>w.id==='si130'),true),eq(r.some(w=>w.id==='my'),true),eq(r.some(w=>w.id==='w130'),false))});
 T('カレンダー: 2025年12月は35マス・先頭は11/30',()=>{const g=monthGrid('2025-12');return all(eq(g.length,35),eq(g[0],'2025-11-30'),eq(g[1],'2025-12-01'))});
 T('カレンダー: 2026年2月は28マス・先頭は2/1',()=>{const g=monthGrid('2026-02');return all(eq(g.length,28),eq(g[0],'2026-02-01'))});
 T('ICS: 日本時間17:00 → UTC 08:00',()=>eq(icsStamp(toMin('2025-12-05','17:00')),'20251205T080000Z'));
 T('ICS: 日またぎの終了(翌7:00 → UTC 前日22:00)',()=>eq(icsStamp(times(sh('2025-12-05','22:00','07:00')).en),'20251205T220000Z'));
 T('ICS: 記号のエスケープ',()=>eq(icsEsc('a,b;c'),'a\\,b\\;c'));
 T('ICS: 長い行の折り返し',()=>{const x='X'.repeat(200),f=icsFold(x);return all(eq(f.split('\r\n').every(l=>l.length<=75),true),eq(f.replace(/\r\n /g,''),x))});
 T('ICS: 1件の中身',()=>{
  const wp=mk({name:'店,A'}),s=sh('2025-12-05','17:00','22:30'),R=calcWp(wp,[s]),t=buildIcs([s],R,false,()=>wp);
  return all(eq(t.includes('DTSTART:20251205T080000Z'),true),eq(t.includes('DTEND:20251205T133000Z'),true),eq(t.includes('SUMMARY:店\\,A'),true),
   eq(t.endsWith('END:VCALENDAR\r\n'),true),eq(t.includes('¥'),false))});
 T('読み込み検査: 壊れたシフトを除く・足りない項目を補う',()=>{
  const j=sanitize({v:1,wps:[{id:'a',name:'x',wages:[{from:'2025-01-01',yen:1000}]}],walls:[],shifts:[
   {id:'1',wpId:'a',date:'2025-12-05',start:'17:00',end:'22:00',status:'planned'},
   {id:'2',wpId:'zzz',date:'2025-12-05',start:'17:00',end:'22:00',status:'planned'},
   {id:'3',wpId:'a',date:'bad',start:'17:00',end:'22:00',status:'planned'}]});
  return all(eq(j.shifts.length,1),eq(j.wps[0].nightPct,25),eq(j.walls.length,8))});
 TA('引継ぎコード: 作って戻すと同じ内容',async()=>{
  const o={v:1,wps:[{id:'a',name:'日本語の店'}],shifts:[],n:[1,2,3]};
  const back=await decodeBackup(await encodeBackup(o));return eq(JSON.stringify(back),JSON.stringify(o))});
 TA('引継ぎコード: 壊れたコードは拒否される',()=>decodeBackup('xxx').then(()=>'拒否されなかった',()=>true));
 return Promise.all(ps).then(()=>res);
}

/* ================= 操作 ================= */
function act(a,d){
 switch(a){
  case'tab':UI.tab=d.t;scrollTo(0,0);break;
  case'mon':UI.month=addMonth(UI.month,+d.d);UI.day='';break;
  case'view':UI.view=d.v;break;
  case'day':UI.day=d.date;break;
  case'newShift':case'newShiftOn':
   if(!S.wps.length){alert('先に勤務先を登録してください');UI.wpForm=newWp();UI.wpForm.isNew=true}
   else UI.form=newShiftForm(a==='newShiftOn'?d.date:'');
   scrollTo(0,0);break;
  case'edit':{const s=S.shifts.find(x=>x.id===d.id);if(!s)return;UI.form={isNew:false,breakMin:'',aStart:'',aEnd:'',...s};scrollTo(0,0);break}
  case'done':{const s=S.shifts.find(x=>x.id===d.id);if(s){s.status='worked';save()}break}
  case'chip':readForm();UI.form.start=d.s;UI.form.end=d.e;break;
  case'saveShift':saveShift();return;
  case'gcal':{readForm();const err=formError(UI.form);if(err){alert(err);return}window.open(gcalUrl(norm(UI.form)),'_blank','noopener');break}
  case'delShift':if(confirm('このシフトを削除しますか?')){S.shifts=S.shifts.filter(s=>s.id!==UI.form.id);save();UI.form=null}break;
  case'cancelForm':UI.form=null;UI.wpForm=null;break;
  case'newWp':UI.wpForm={...newWp(),isNew:true};UI.tab='set';scrollTo(0,0);break;
  case'editWp':{const w=wpOf(d.id);if(!w)return;UI.wpForm={...JSON.parse(JSON.stringify(w)),isNew:false};scrollTo(0,0);break}
  case'addWage':readWp();UI.wpForm.wages.push({from:todayStr(),yen:''});break;
  case'delWage':readWp();UI.wpForm.wages.splice(+d.i,1);break;
  case'saveWp':saveWp();return;
  case'delWp':if(confirm('この勤務先と、そのシフトをすべて削除しますか?')){const id=UI.wpForm.id;S.wps=S.wps.filter(w=>w.id!==id);S.shifts=S.shifts.filter(s=>s.wpId!==id);save();UI.wpForm=null}break;
  case'addWall':S.walls.push({id:uid(),name:'新しい壁',amount:1000000,basis:'cal',commute:false,incl:false,on:true,cat:'その他',note:'',scope:'',noPrem:false,ver:''});save();break;
  case'delWall':S.walls.splice(+d.i,1);save();break;
  case'resetWalls':if(confirm('壁の設定を初期値に戻しますか?(追加した壁も消えます)')){S.walls=DEFAULT_WALLS();save()}break;
  case'share':shareBackup();return;
  case'export':exportData();break;
  case'makeCode':encodeBackup(backupObj()).then(c=>{UI.code=c;render()});return;
  case'copyCode':copyCode();return;
  case'restoreCode':restoreCode();return;
  case'undo':{
   const p=localStorage.getItem(KEY+'-prev');
   if(p&&confirm('読み込む前のデータに戻します。今のデータは置き換わります。よろしいですか?')){
    try{S=sanitize(JSON.parse(p));save(true);localStorage.removeItem(KEY+'-prev')}catch(e){alert('戻せませんでした')}
   }
   break}
  case'ics':exportIcs();return;
  case'hideIos':S.hideIos=true;save(true);break;
  case'test':runTests().then(r=>{UI.test=r;render()});return;
  case'wipe':if(confirm('すべてのデータを削除します。元に戻せません。バックアップは保存しましたか?')&&confirm('本当に削除しますか?')){
   localStorage.removeItem(KEY);localStorage.removeItem(KEY+'-prev');S=load();
   UI={tab:'home',month:todayStr().slice(0,7),view:'cal',day:'',form:null,wpForm:null,test:null,code:''}}break;
 }
 render();
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t)act(t.dataset.a,t.dataset)});
document.addEventListener('input',e=>{
 if(UI.form&&e.target.closest('#f')){readForm();const el=$('#est');if(el)el.innerHTML=estHtml()}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='imp'){importFile(t.files[0]);t.value='';return}
 if(t.closest('#wl')){
  document.querySelectorAll('#wl .wr').forEach((r,i)=>{
   const w=S.walls[i];if(!w)return;const g=n=>r.querySelector('[name='+n+']');
   w.name=g('name').value.trim()||w.name;const a=Math.round(Number(g('amount').value));if(a>0)w.amount=a;
   w.cat=g('cat').value;w.basis=g('basis').value;w.on=g('on').checked;w.commute=g('commute').checked;w.noPrem=g('noPrem').checked;
   w.scope=g('scope').checked?'wp':'';w.incl=g('incl').checked;w.ver=g('ver').checked?(w.ver||todayStr()):'';w.note=g('note').value.slice(0,600)});
  save();return;
 }
 if(t.hasAttribute('data-rerender')&&UI.form){readForm();render()}
});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(r=>{PERSIST=r},()=>{});
render();
</script>
